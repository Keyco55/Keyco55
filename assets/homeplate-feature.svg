<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HOMEPLATE / KBO-Hub</title>
  <desc id="desc">KBO 팬 경험을 한곳에 모으는 웹 서비스. Deployed, Closed Beta.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#17122D"/><stop offset=".52" stop-color="#10162B"/><stop offset="1" stop-color="#08202A"/></linearGradient>
    <linearGradient id="accent" x1="90" y1="80" x2="1080" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#C4B5FD" stroke-opacity=".06"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
