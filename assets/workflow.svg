<svg width="1200" height="410" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How keyco builds</title><desc id="desc">A human-directed product development workflow from planning through release gate</desc>
